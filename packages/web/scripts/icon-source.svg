<!--
  The brand mark is now the kvy-head glyph traced from
  `../src/app/apple-icon.png` (the source of truth — black mark on white),
  not this file. `kvy-mark-512.png` in this directory is a white-on-transparent
  master cut from it; every raster icon (icon-192/512, web-app-manifest-*,
  apple-touch-icon, favicon.ico, og.png, screenshots) and `../public/icon.svg`
  (a `<image>`-embedded variant) are derived from that master via a one-off
  script (see git history for the exact generation code) rather than this SVG.
  Keep this file only as a fallback flat "F" mark if the traced artwork is
  ever lost; it is not wired into the build.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Kvy</title>
  <rect width="512" height="512" rx="96" fill="#0b0f19"/>
  <text
    x="256"
    y="370"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="330"
    fill="#5b9bff"
  >F</text>
</svg>
