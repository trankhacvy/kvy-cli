<!--
  Source for the PWA icon set (plan-v2.md W4.2 "PWA manifest icons"). Regenerate
  the raster assets in ../public/ with rsvg-convert (or any SVG rasterizer):
    rsvg-convert -w 512 -h 512 icon-source.svg -o ../public/icon-512.png
    rsvg-convert -w 192 -h 192 icon-source.svg -o ../public/icon-192.png
    rsvg-convert -w 180 -h 180 icon-source.svg -o ../public/apple-touch-icon.png
  favicon.ico is a plain PNG-in-ICO container (16px + 32px frames) — see the
  git history for this file for the packer script used to build it.
  ../public/icon.svg is the same artwork minus this comment (kept minimal
  since it's served directly, as the `any`-size manifest icon and one of
  layout.tsx's `<link rel="icon">`s).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Falcon</title>
  <rect width="512" height="512" rx="96" fill="#0b0f19"/>
  <text
    x="256"
    y="370"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="330"
    fill="#5b9bff"
  >F</text>
</svg>
