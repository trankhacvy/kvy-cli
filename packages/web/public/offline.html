<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Offline · Falcon</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: #0b0f19;
        color: #e8eaef;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: #9aa3b5;
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: #e8eaef;
        color: #0b0f19;
        font: inherit;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.625rem 1rem;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Falcon needs a network connection to reach your machines. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
