name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability instead? Please follow [SECURITY.md](../../SECURITY.md) rather than filing a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `kvy claude` in ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: '`kvy doctor` output'
      description: Run `kvy doctor` and paste its output.
      render: text

  - type: input
    id: version
    attributes:
      label: kvy version
      placeholder: "kvy --version"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
