name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / build wire / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both the wire additive-only lint and the changeset check below
          # diff against origin/$GITHUB_BASE_REF with `...`, which needs a
          # real merge-base — a shallow clone leaves HEAD's side of that
          # history truncated and fails with "no merge base" (same root
          # cause release.yml's own fetch-depth: 0 comment documents).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build @kvy/wire
        run: pnpm --filter @kvy/wire build

      - name: Fetch base branch (for wire additive-only lint)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

      - name: Wire schema additive-only lint (vs base branch)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm --filter @kvy/wire run lint:additive

      - name: Changeset check (CLI/wire/crypto changes require a changeset)
        # Skip on pushes to main and on the Changesets "Version Packages" PR itself.
        if: |
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/')
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only origin/$GITHUB_BASE_REF...HEAD)
          CLI_CHANGED=$(echo "$CHANGED" | grep -cE "^packages/(cli|wire|crypto)/" || true)
          if [ "$CLI_CHANGED" -gt 0 ]; then
            CHANGESET_ADDED=$(echo "$CHANGED" | grep -cE "^\.changeset/.+\.md$" || true)
            if [ "$CHANGESET_ADDED" -eq 0 ]; then
              echo "::error::This PR touches packages/cli, packages/wire, or packages/crypto but includes no changeset file."
              echo "::error::Run 'pnpm changeset', answer the prompts, and commit the generated .md file alongside your changes."
              exit 1
            fi
            echo "Changeset present — OK."
          else
            echo "No publishable packages changed — changeset not required."
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
