name: release

# Cuts a Falcon CLI release: standalone bun-compiled binaries (darwin-arm64/
# x64, linux-x64) attached to a GitHub Release for scripts/install.sh to
# fetch, plus the same build published to npm so `npm install -g falcon`
# keeps working (falcon-system-design.md §3, plan.md §16 "4.3 Distribution
# & self-host").
#
# Trigger: push a `vX.Y.Z` tag matching packages/cli/package.json's
# "version" field, or run manually via workflow_dispatch.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install workspace deps
        run: pnpm install --frozen-lockfile

      - name: build falcon + its workspace dependencies
        run: pnpm --filter falcon... build

      - uses: oven-sh/setup-bun@v2

      - name: compile standalone binaries (darwin-arm64/x64, linux-x64)
        run: bash scripts/build-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: falcon-binaries
          path: dist-binaries/*
          if-no-files-found: error

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: falcon-binaries
          path: dist-binaries

      - name: publish GitHub Release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist-binaries/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-cli-latest:
    # The rolling self-update pointer (`falcon update` / auto-update-on-start,
    # plan.md §16 "4.3 Distribution & self-host"): re-publishes this run's
    # binaries + VERSION file under a fixed `cli-latest` tag, on every real
    # release, so `packages/cli/src/update/` can always find "the current
    # version" and its assets at one stable URL
    # (github.com/<repo>/releases/download/cli-latest/...) without needing
    # to know the exact vX.Y.Z tag ahead of time. Independent of
    # `github-release`/`publish-npm` (needs only `build-binaries`) so a
    # failure in either doesn't block this rolling pointer from updating.
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: falcon-binaries
          path: dist-binaries

      # Deliberately delete-then-create rather than relying on
      # softprops/action-gh-release's own upsert/asset-overwrite behavior
      # for a tag that already has a release. That behavior exists and is
      # documented, but this repo has no way to exercise a second real run
      # against a fixed tag in CI/sandbox to confirm it end-to-end (see
      # task-summary's "Known limitations"), so this step removes the
      # dependency on it entirely: `gh release delete` is the documented,
      # first-party way to clear a tag's release, making every run of this
      # job start from the same "no existing cli-latest release" state
      # regardless of what any previous run left behind. The `|| echo ...`
      # fallback is needed because the very first release ever cut has no
      # prior `cli-latest` release to delete, and `gh release delete`
      # exits non-zero in that case. `--cleanup-tag` also removes the git
      # tag itself so the very next `softprops/action-gh-release` step is
      # always creating a fresh tag + release, never editing one.
      - name: delete previous cli-latest release/tag, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest \
            --repo "${{ github.repository }}" \
            --yes \
            --cleanup-tag \
            || echo "no existing cli-latest release to delete — first release, continuing"

      - name: publish rolling cli-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: "cli-latest (rolling self-update pointer)"
          body: "Rolling pointer to the most recently released falcon CLI — consumed by `falcon update` / auto-update-on-start, not meant for direct human download. See the versioned release for changelog/notes."
          files: dist-binaries/*
          fail_on_unmatched_files: true

  publish-npm:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: install workspace deps
        run: pnpm install --frozen-lockfile

      - name: build falcon + its workspace dependencies
        run: pnpm --filter falcon... build

      # Regular `npm install -g falcon` runs on Node (bin/falcon.mjs →
      # dist/index.mjs) — no compiled binary needed in this package, so the
      # tsc/pkgroll build above is all `npm publish` ships.
      - name: publish falcon to npm
        run: pnpm --filter falcon publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
