name: release

# Native distribution (curl | sh, and eventually Homebrew) and npm
# publishing are INDEPENDENT of each other — neither needs the other to
# succeed:
#   - `publish-npm` best-effort publishes `@vibe-oss/kvy` via Changesets
#     (`continue-on-error: true` — nothing else in this workflow depends on
#     it, so any registry-side failure never blocks a release; this is also
#     why the package is scoped under the vibe-oss org rather than
#     unscoped — npm's name-similarity filter rejected every unscoped
#     candidate name tried, e.g. `kvy`/`kvy-cli`, but scoped names aren't
#     subject to that filter at all). @kvy/wire and @kvy/crypto are
#     internal-only (private, bundled straight into @vibe-oss/kvy's own
#     build output by pkgroll — see packages/cli/package.json's
#     devDependencies) and @kvy/server / @kvy/web / @kvy/e2e are deployed,
#     never versioned — all five are excluded via .changeset/config.json's
#     `ignore`, so this only ever publishes `@vibe-oss/kvy` itself.
#   - `resolve-native-release` mints a `vX.Y.Z` tag straight from
#     `packages/cli/package.json`'s current version, whenever that version
#     hasn't been tagged yet — no dependency on npm publishing at all. A
#     real per-OS matrix then compiles standalone Node SEA binaries
#     (packages/cli/scripts/native/, kvy-system-design.md §3) and attaches
#     them to that tag's GitHub Release for scripts/install.sh (and,
#     eventually, a Homebrew formula) to fetch.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish-npm:
    name: version or publish (changesets, best-effort)
    runs-on: ubuntu-latest
    # A registry-side rejection (e.g. npm's name-similarity filter) fails
    # this job's steps, but must not fail — or block — the workflow: native
    # binary distribution doesn't need npm at all. Nothing else in this
    # workflow reads this job's outputs or `needs` it.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets diffs against main to find pending changesets — needs
          # real history, not a shallow clone (confirmed the hard way: fails
          # with "Failed to find where HEAD diverged from main" otherwise).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # kvy's own build bundles @kvy/wire + @kvy/crypto straight into its
      # dist output (pkgroll treats devDependencies as inline-able, unlike
      # dependencies) — both still need their own `dist/` built first so
      # pkgroll has something to resolve and inline.
      - name: Build kvy (bundles @kvy/wire + @kvy/crypto)
        run: pnpm --filter @kvy/wire --filter @kvy/crypto --filter @vibe-oss/kvy build

      # npm packs LICENSE from the package's own directory, not the monorepo
      # root — copy it in right before publish rather than keeping a second,
      # driftable copy checked into packages/cli/.
      - name: Copy LICENSE into packages/cli for the npm tarball
        run: cp LICENSE packages/cli/LICENSE

      - name: Version or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "ci: version packages"
          title: "ci: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # continue-on-error above means a real misconfiguration (missing
      # NPM_TOKEN, wrong access level, missing permissions) fails silently —
      # same neutral icon as a transient npm outage. Surface it loudly so it
      # can't sit unnoticed.
      - name: Flag a failed version/publish step
        if: steps.changesets.outcome == 'failure'
        run: |
          echo "### :warning: npm version/publish step failed" >> "$GITHUB_STEP_SUMMARY"
          echo "This job continues on error so a registry outage never blocks the native binary release below, but a failure here needs a look — check the \"Version or publish\" step's logs above." >> "$GITHUB_STEP_SUMMARY"

  resolve-native-release:
    name: resolve kvy's release tag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Independent of npm entirely: the source of truth for "is there a
      # new release to cut" is packages/cli/package.json's own version, not
      # anything changesets/npm reported. `scripts/install.sh`, the GitHub
      # Release, and the `cli-latest` rolling pointer all expect a plain
      # `vX.Y.Z` tag.
      #
      # Checks for an actual GitHub RELEASE, not just the git tag: a
      # cancelled or partially-failed prior run can leave the tag pushed
      # with no release ever published for it (confirmed live — a stuck
      # matrix leg got cancelled after this step had already run,
      # orphaning a bare `v0.1.0` tag with no release behind it). Treating
      # bare tag existence as "already released" would permanently wedge
      # every future run on that version. `git tag`/`git push` below
      # tolerate the tag already existing (`|| true`) for exactly that
      # recovery case — reuse it rather than erroring.
      - name: Resolve whether kvy's version needs a new tag/release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-native-binaries:
    name: build (${{ matrix.suffix }})
    needs: resolve-native-release
    if: needs.resolve-native-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Proven end-to-end on this exact target: real compiled binary,
          # real pty session (spawn, resize, keyring auth, clean exit).
          - os: macos-14
            suffix: darwin-arm64
          # darwin-x64 (macos-13) is deliberately OMITTED, not broken: a
          # real build was queued against it for 30+ minutes with no runner
          # ever assigned, while every other label in this matrix scheduled
          # within seconds — GitHub Actions bills macOS runner-minutes at
          # 10x Linux's, so a spending/included-minutes limit most likely
          # got hit and is silently queueing rather than erroring. Re-add
          # this once that's confirmed/resolved (Settings > Billing >
          # Actions) — it's a scheduling problem, not a code problem, so no
          # build-side fix belongs here.
          # KNOWN BROKEN, not just unverified: node-pty@1.1.0 ships prebuilds
          # for darwin-arm64/darwin-x64/win32-arm64/win32-x64 only — no
          # linux-x64 or linux-arm64 at all (confirmed by inspecting the
          # installed package's own prebuilds/ directory). native-assets.mjs
          # has nothing to embed here until node-pty either ships Linux
          # prebuilds or this build learns to compile it from source
          # (node-gyp) as a fallback. Left in the matrix (not removed)
          # so this stays visible as a real gap rather than a silently
          # dropped platform — github-release/publish-cli-latest below
          # tolerate this leg failing and still ship every platform that did
          # succeed.
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          # First real run caught a genuine bug here (now fixed): the
          # postject step shelled out to `npx` via `execFileSync`, which
          # can't find `npx.cmd` without `shell: true` on Windows — see
          # build.mjs's `run()` call for postject.
          - os: windows-latest
            suffix: win32-x64
          - os: windows-11-arm
            suffix: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-native-release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build kvy + its workspace dependencies
        run: pnpm --filter @vibe-oss/kvy... build

      - name: Compile standalone binary (Node SEA)
        shell: bash
        run: bash scripts/build-binaries.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kvy-binaries-${{ matrix.suffix }}
          path: dist-binaries/*
          if-no-files-found: error

  github-release:
    # `build-native-binaries` is a matrix with fail-fast: false — some
    # targets are still unverified (native prebuilds don't exist for every
    # platform upstream, e.g. node-pty ships no Linux prebuilds at all as
    # of 1.1.0) and are expected to fail independently of the others. A
    # matrix job's overall conclusion is "failure" if ANY leg fails, so a
    # plain `needs: build-native-binaries` would skip this — and every
    # platform that DID succeed — over one that didn't. Proceed with
    # whatever artifacts got uploaded instead (`!cancelled()`, not
    # `always()`, so an actually-cancelled run still doesn't publish).
    needs: [resolve-native-release, build-native-binaries]
    if: |
      !cancelled() &&
      needs.resolve-native-release.result == 'success' &&
      needs.resolve-native-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kvy-binaries-*
          path: dist-binaries
          merge-multiple: true

      - name: publish GitHub Release with binaries attached
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.resolve-native-release.outputs.tag }}
          files: dist-binaries/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-cli-latest:
    # The rolling self-update pointer (`kvy update` / auto-update-on-start):
    # re-publishes this run's
    # binaries + VERSION file under a fixed `cli-latest` tag, on every real
    # kvy release, so `packages/cli/src/update/` can always find "the
    # current version" and its assets at one stable URL
    # (github.com/<repo>/releases/download/cli-latest/...) without needing
    # to know the exact vX.Y.Z tag ahead of time. Independent of
    # `github-release` (needs only `build-native-binaries`) so a failure in
    # one doesn't block the other. Same partial-matrix reasoning as
    # `github-release` above: proceeds on whatever platforms succeeded.
    needs: [resolve-native-release, build-native-binaries]
    if: |
      !cancelled() &&
      needs.resolve-native-release.result == 'success' &&
      needs.resolve-native-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kvy-binaries-*
          path: dist-binaries
          merge-multiple: true

      # Deliberately delete-then-create rather than relying on
      # softprops/action-gh-release's own upsert/asset-overwrite behavior
      # for a tag that already has a release. That behavior exists and is
      # documented, but this repo has no way to exercise a second real run
      # against a fixed tag in CI/sandbox to confirm it end-to-end, so this
      # step removes the dependency on it entirely: `gh release delete` is
      # the documented, first-party way to clear a tag's release, making
      # every run of this job start from the same "no existing cli-latest
      # release" state regardless of what any previous run left behind. The
      # `|| echo ...` fallback is needed because the very first release
      # ever cut has no prior `cli-latest` release to delete, and
      # `gh release delete` exits non-zero in that case. `--cleanup-tag`
      # also removes the git tag itself so the very next
      # `softprops/action-gh-release` step is always creating a fresh tag +
      # release, never editing one.
      - name: delete previous cli-latest release/tag, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest \
            --repo "${{ github.repository }}" \
            --yes \
            --cleanup-tag \
            || echo "no existing cli-latest release to delete — first release, continuing"

      - name: publish rolling cli-latest release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: cli-latest
          name: "cli-latest (rolling self-update pointer)"
          body: "Rolling pointer to the most recently released kvy CLI — consumed by `kvy update` / auto-update-on-start, not meant for direct human download. See the versioned release for changelog/notes."
          files: dist-binaries/*
          fail_on_unmatched_files: true

  bump-homebrew-cask:
    # Casks/kvy.rb lives in a SEPARATE repo (trankhacvy/homebrew-vibe-oss),
    # so this job's default GITHUB_TOKEN (scoped to this repo only) can't
    # push to it — that's what left the cask silently stuck on an old
    # version indefinitely before this job existed (confirmed live:
    # `brew install kvy` kept reporting "already the latest version" two
    # real releases behind). HOMEBREW_TAP_TOKEN must be a PAT (fine-grained,
    # scoped to just that repo's contents: write) added as a repo secret
    # here — this job is a safe no-op (skips cleanly) until that secret
    # exists, it never fails the rest of the release.
    #
    # Only darwin-arm64 ships in the cask today (same reasoning as
    # Casks/kvy.rb's own `depends_on arch: :arm64` comment), so this only
    # ever needs that one leg's artifact — independent of whatever the
    # other matrix legs did.
    needs: [resolve-native-release, build-native-binaries]
    if: |
      !cancelled() &&
      needs.resolve-native-release.result == 'success' &&
      needs.resolve-native-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download darwin-arm64 binary (tolerate a failed/skipped leg)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kvy-binaries-darwin-arm64
          path: dist-binaries

      - name: Check whether HOMEBREW_TAP_TOKEN is configured and the binary is present
        id: check
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew cask bump. See this job's own comment in release.yml for what's needed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.download.outcome }}" != "success" ]; then
            echo "::warning::darwin-arm64 binary missing from this release — skipping the Homebrew cask bump."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trankhacvy/homebrew-vibe-oss
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trankhacvy/homebrew-vibe-oss
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-vibe-oss

      - name: Bump Casks/kvy.rb and push
        if: steps.check.outputs.proceed == 'true'
        working-directory: homebrew-vibe-oss
        env:
          TAG: ${{ needs.resolve-native-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          SHA256=$(cut -d ' ' -f1 ../dist-binaries/kvy-darwin-arm64.sha256)

          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            Casks/kvy.rb

          if git diff --quiet; then
            echo "Casks/kvy.rb already at ${VERSION} — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "kvy ${VERSION}"
          git push origin main
