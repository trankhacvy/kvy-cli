name: release

# Native distribution (curl | sh, and eventually Homebrew) and npm
# publishing are INDEPENDENT of each other — neither needs the other to
# succeed:
#   - `publish-npm` best-effort publishes `kvy-cli` via Changesets
#     (`continue-on-error: true` — nothing else in this workflow depends on
#     it, so an npm-side failure, e.g. the registry's name-similarity
#     filter rejecting a candidate name, never blocks a release). @kvy/wire
#     and @kvy/crypto are internal-only (private, bundled straight into
#     kvy-cli's own build output by pkgroll — see
#     packages/cli/package.json's devDependencies) and @kvy/server /
#     @kvy/web / @kvy/e2e are deployed, never versioned — all five are
#     excluded via .changeset/config.json's `ignore`, so this only ever
#     publishes `kvy-cli` itself.
#   - `resolve-native-release` mints a `vX.Y.Z` tag straight from
#     `packages/cli/package.json`'s current version, whenever that version
#     hasn't been tagged yet — no dependency on npm publishing at all. A
#     real per-OS matrix then compiles standalone Node SEA binaries
#     (packages/cli/scripts/native/, kvy-system-design.md §3) and attaches
#     them to that tag's GitHub Release for scripts/install.sh (and,
#     eventually, a Homebrew formula) to fetch.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-npm:
    name: version or publish (changesets, best-effort)
    runs-on: ubuntu-latest
    # A registry-side rejection (e.g. npm's name-similarity filter) fails
    # this job's steps, but must not fail — or block — the workflow: native
    # binary distribution doesn't need npm at all. Nothing else in this
    # workflow reads this job's outputs or `needs` it.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets diffs against main to find pending changesets — needs
          # real history, not a shallow clone (confirmed the hard way: fails
          # with "Failed to find where HEAD diverged from main" otherwise).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # kvy's own build bundles @kvy/wire + @kvy/crypto straight into its
      # dist output (pkgroll treats devDependencies as inline-able, unlike
      # dependencies) — both still need their own `dist/` built first so
      # pkgroll has something to resolve and inline.
      - name: Build kvy (bundles @kvy/wire + @kvy/crypto)
        run: pnpm --filter @kvy/wire --filter @kvy/crypto --filter kvy-cli build

      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "ci: version packages"
          title: "ci: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  resolve-native-release:
    name: resolve kvy's release tag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Independent of npm entirely: the source of truth for "is there a
      # new release to cut" is packages/cli/package.json's own version, not
      # anything changesets/npm reported. `scripts/install.sh`, the GitHub
      # Release, and the `cli-latest` rolling pointer all expect a plain
      # `vX.Y.Z` tag — mint one only if this exact version hasn't already
      # been tagged (covers both "no version bump since last release" and
      # "this exact commit already got tagged by a prior run").
      - name: Resolve whether kvy's version needs a new tag/release
        id: resolve
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-native-binaries:
    name: build (${{ matrix.suffix }})
    needs: resolve-native-release
    if: needs.resolve-native-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Proven end-to-end on this exact target: real compiled binary,
          # real pty session (spawn, resize, keyring auth, clean exit) — see
          # docs/git-guide.md.
          - os: macos-14
            suffix: darwin-arm64
          # Structurally identical to the target above, but UNVERIFIED —
          # this matrix is the first real test of each. Node SEA has no
          # cross-compilation, so there is no way to test these except on
          # real hardware/runners of that exact platform; expect follow-up
          # fixes, especially for Windows, which doesn't use node-pty's
          # POSIX pty path at all (ConPTY instead — a genuinely different
          # code path, never exercised).
          - os: macos-13
            suffix: darwin-x64
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          - os: windows-latest
            suffix: win32-x64
          - os: windows-11-arm
            suffix: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-native-release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build kvy + its workspace dependencies
        run: pnpm --filter kvy-cli... build

      - name: Compile standalone binary (Node SEA)
        shell: bash
        run: bash scripts/build-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kvy-binaries-${{ matrix.suffix }}
          path: dist-binaries/*
          if-no-files-found: error

  github-release:
    needs: [resolve-native-release, build-native-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kvy-binaries-*
          path: dist-binaries
          merge-multiple: true

      - name: publish GitHub Release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-native-release.outputs.tag }}
          files: dist-binaries/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-cli-latest:
    # The rolling self-update pointer (`kvy update` / auto-update-on-start,
    # plan.md §16 "4.3 Distribution & self-host"): re-publishes this run's
    # binaries + VERSION file under a fixed `cli-latest` tag, on every real
    # kvy release, so `packages/cli/src/update/` can always find "the
    # current version" and its assets at one stable URL
    # (github.com/<repo>/releases/download/cli-latest/...) without needing
    # to know the exact vX.Y.Z tag ahead of time. Independent of
    # `github-release` (needs only `build-native-binaries`) so a failure in
    # one doesn't block the other.
    needs: [resolve-native-release, build-native-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kvy-binaries-*
          path: dist-binaries
          merge-multiple: true

      # Deliberately delete-then-create rather than relying on
      # softprops/action-gh-release's own upsert/asset-overwrite behavior
      # for a tag that already has a release. That behavior exists and is
      # documented, but this repo has no way to exercise a second real run
      # against a fixed tag in CI/sandbox to confirm it end-to-end, so this
      # step removes the dependency on it entirely: `gh release delete` is
      # the documented, first-party way to clear a tag's release, making
      # every run of this job start from the same "no existing cli-latest
      # release" state regardless of what any previous run left behind. The
      # `|| echo ...` fallback is needed because the very first release
      # ever cut has no prior `cli-latest` release to delete, and
      # `gh release delete` exits non-zero in that case. `--cleanup-tag`
      # also removes the git tag itself so the very next
      # `softprops/action-gh-release` step is always creating a fresh tag +
      # release, never editing one.
      - name: delete previous cli-latest release/tag, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest \
            --repo "${{ github.repository }}" \
            --yes \
            --cleanup-tag \
            || echo "no existing cli-latest release to delete — first release, continuing"

      - name: publish rolling cli-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: "cli-latest (rolling self-update pointer)"
          body: "Rolling pointer to the most recently released kvy CLI — consumed by `kvy update` / auto-update-on-start, not meant for direct human download. See the versioned release for changelog/notes."
          files: dist-binaries/*
          fail_on_unmatched_files: true
