# Production stack: server only — Postgres is a separate, already-provisioned
# instance (a Coolify-managed database resource, Neon, RDS, ...), not bundled
# here. See the `networks:` block at the bottom for why that matters when the
# Postgres is itself a Docker container next to this one (e.g. Coolify).
#
# Web (@kvy/web) deploys to Vercel as a static export.
# Blobs use Cloudflare R2 (S3-compatible, cheap).
#
# Usage:
#   cp deploy/.env.prod .env  (or .env.prod if you keep both side-by-side)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The web app (deployed to Vercel) calls this server at PUBLIC_API_ORIGIN.

version: "3.8"

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-3005}:3005"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3005
      # REQUIRED: connection string for a Postgres you provisioned yourself.
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to your Postgres connection string}
      # REQUIRED: HMAC signing key for auth JWTs
      - KVY_MASTER_SECRET=${KVY_MASTER_SECRET:?Set KVY_MASTER_SECRET in .env}
      # Web app origin (Vercel) for CORS allowlist
      - CORS_ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN to your Vercel domain}
      - PUBLIC_WEB_ORIGIN=${PUBLIC_WEB_ORIGIN}
      # API origin (this server) for blob storage absolute URLs
      - PUBLIC_API_ORIGIN=${PUBLIC_API_ORIGIN:?Set PUBLIC_API_ORIGIN to your API domain/reverse-proxy}
      # Cloudflare R2 (S3-compatible)
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      # OAuth (optional)
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      # Web Push (optional)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Notifications (optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NTFY_BASE_URL=${NTFY_BASE_URL}
    networks:
      - coolify

# External network Coolify already manages for standalone resources on this
# server (Coolify UI: Destinations -> "coolify"). Attaching `server` to it is
# what lets this container resolve a Coolify-managed database resource's
# internal hostname (e.g. `v10o0vxevsrdxa3sd2q4ww4f`) by Docker DNS — a
# service-scoped `networks:` list opts a container OUT of any network Compose
# would otherwise attach by default, which is what silently broke this before.
#
# Not deploying via Coolify, or your Postgres is reachable over the public
# internet (Neon, RDS, ...)? Delete the `networks:` list on `server` above
# and this block below — the default Compose network already allows outbound
# internet connections.
networks:
  coolify:
    external: true
