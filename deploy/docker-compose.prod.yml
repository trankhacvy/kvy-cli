# Production stack: server + Postgres only.
# Web (@kvy/web) deploys to Vercel as a static export.
# Blobs use Cloudflare R2 (S3-compatible, cheap).
#
# Usage:
#   cp deploy/.env.prod .env  (or .env.prod if you keep both side-by-side)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The web app (deployed to Vercel) calls this server at PUBLIC_API_ORIGIN.

version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kvy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kvy}
      POSTGRES_DB: kvy
    volumes:
      - kvy-pg-data-v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvy -d kvy"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_PORT:-3005}:3005"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3005
      # Set DATABASE_URL directly to point at a Postgres you provisioned
      # yourself (a Coolify-managed database resource, Neon, RDS, ...) —
      # it always wins. Left unset, this falls back to the bundled
      # `postgres` service above, using POSTGRES_PASSWORD for its password.
      - DATABASE_URL=${DATABASE_URL:-postgres://kvy:${POSTGRES_PASSWORD:-kvy}@postgres:5432/kvy}
      # REQUIRED: HMAC signing key for auth JWTs
      - KVY_MASTER_SECRET=${KVY_MASTER_SECRET:?Set KVY_MASTER_SECRET in .env}
      # Web app origin (Vercel) for CORS allowlist
      - CORS_ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN to your Vercel domain}
      - PUBLIC_WEB_ORIGIN=${PUBLIC_WEB_ORIGIN}
      # API origin (this server) for blob storage absolute URLs
      - PUBLIC_API_ORIGIN=${PUBLIC_API_ORIGIN:?Set PUBLIC_API_ORIGIN to your API domain/reverse-proxy}
      # Cloudflare R2 (S3-compatible)
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      # OAuth (optional)
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      # Web Push (optional)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Notifications (optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NTFY_BASE_URL=${NTFY_BASE_URL}
    networks:
      - kvy-net

networks:
  kvy-net:
    driver: bridge

volumes:
  kvy-pg-data-v3:
    driver: local
