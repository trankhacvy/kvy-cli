# Local development datastore only.
#
# Spins up a real Postgres 16 so `packages/server` can run against the same
# SQL dialect it uses in prod/self-host (design decision: one dialect, one
# drizzle-kit migration set forever — see falcon-system-design.md §6.5).
#
# This is the dev-only precursor to `deploy/docker-compose.yml` (Phase 4),
# which will add the `server` service (+ optional `minio`) for self-hosting.
# Until then, run the server locally with `pnpm dev` against this database.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://falcon:falcon@localhost:5432/falcon

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon
      POSTGRES_DB: falcon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - falcon-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  falcon-pg-dev: {}
